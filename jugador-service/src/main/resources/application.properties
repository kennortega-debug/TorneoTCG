spring.application.name=jugador-service
server.port=0

# Configuración de Base de Datos (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/db_jugador_tcg?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA / Hibernate - Con Flyway desactivamos la creación automática de Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Activación de Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true